<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>病理切片查看</title>
  <link rel="stylesheet" href="/static/share.css?v=20260731k" />
  <!-- OpenSeadragon 5.0.1（已本地化） -->
  <script src="/static/openseadragon.min.js"></script>
</head>
<body>
  <!-- 无效 token 遮罩 -->
  <div id="invalid-mask" class="invalid-mask" style="display:none;">
    <div class="invalid-text">链接无效或已过期</div>
  </div>

  <!-- 顶栏：macOS unified titlebar（白/微透明 + blur） -->
  <header id="app-header">
    <span class="header-title">病理切片查看</span>
    <span id="current-slide" class="header-current">加载中…</span>
  </header>

  <!-- 切片切换栏（多张时显示）：横向滚动圆角 pill -->
  <div id="slide-chips" class="slide-chips" style="display:none;"></div>

  <!-- 工具栏（紧凑两行） -->
  <div id="toolbar">
    <!-- 第一行 -->
    <div class="tb-row">
      <div class="btn-group">
        <button id="zoom-out" class="icon-btn" title="缩小" aria-label="缩小">−</button>
        <button id="zoom-in" class="icon-btn" title="放大" aria-label="放大">+</button>
      </div>
      <button id="rotate-btn" class="icon-btn" title="顺时针旋转 90°" aria-label="旋转">↻</button>
      <button id="flip-btn" class="icon-btn" title="水平翻转（镜像）" aria-label="镜像">⇋</button>

      <!-- ROI 分段控件（macOS 分段样式） -->
      <div class="seg-control roi-group" role="group" aria-label="ROI 分段">
        <button id="roi-6" class="seg roi-btn" data-size="6">6mm</button>
        <button id="roi-6-5" class="seg roi-btn" data-size="6.5">6.5mm</button>
      </div>

      <!-- 标注绘制工具 -->
      <div class="btn-group anno-tools">
        <button id="anno-arrow-btn" class="tool-btn" title="绘制箭头标注">↗</button>
        <button id="anno-free-btn" class="tool-btn" title="绘制描图标注">〰</button>
      </div>
      <!-- 显示管理员/全部标注（默认开） -->
      <button id="anno-all-btn" class="tool-btn active" title="显示/隐藏标记">标记</button>

      <button id="reset-btn" class="tool-btn" title="复位">Reset</button>

      <div class="spacer"></div>
      <span id="zoom-badge" class="zoom-badge">100%</span>
    </div>

    <!-- 第二行 -->
    <div class="tb-row">
      <input id="roi-label" type="text" maxlength="40"
             class="roi-label-input" placeholder="标记人/标签（如 张三 / 病理号）"
             title="保存选区前请填写标记人或标签" autocomplete="off" />
      <input id="roi-note" type="text" maxlength="500"
             class="roi-note-input" placeholder="备注（可选，气泡显示）"
             title="保存选区时的备注，以气泡形式显示在标记旁"
             autocomplete="off" />
      <button id="save-roi-btn" class="tool-btn primary" disabled>保存选区</button>
      <button id="export-btn" class="tool-btn secondary" disabled>导出图片</button>
      <button id="roi-panel-toggle" class="tool-btn">选区(0)</button>

      <!-- mpp 手动设置区（仅 mpp 缺失或估算时显示） -->
      <div id="mpp-setter" class="mpp-setter" style="display:none;">
        <input id="mpp-input" type="number" step="0.01" min="0.01" placeholder="mpp" title="手动输入 µm/px" />
        <button id="mpp-set-btn" class="tool-btn">设置</button>
      </div>
    </div>
  </div>

  <!-- 查看器 -->
  <main id="viewer-wrap">
    <div id="viewer"></div>
    <!-- 标注画布层 -->
    <canvas id="anno-canvas" class="anno-canvas"></canvas>
  </main>

  <!-- 选区面板：底部抽屉（macOS sheet 风） -->
  <div id="roi-panel-mask" class="roi-panel-mask" style="display:none;"></div>
  <div id="roi-panel" class="roi-panel" style="display:none;">
    <div class="roi-panel-handle"></div>
    <div class="roi-panel-header">
      <span>已保存选区</span>
      <button id="roi-panel-close" class="roi-panel-close" aria-label="关闭">×</button>
    </div>
    <div id="roi-panel-edit" class="roi-panel-edit" style="display:none;"></div>
    <div id="roi-panel-list" class="roi-panel-list">
      <div class="roi-panel-empty">暂无选区</div>
    </div>
  </div>

  <!-- toast 容器 -->
  <div id="toast-container"></div>

  <script>
    window.__SHARE_TOKEN__ = "{{ token }}";
  </script>
  <script src="/static/share.js?v=20260731k"></script>
</body>
</html>
