<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SVS 病理图像查看器</title>
  <link rel="stylesheet" href="/static/style.css?v=20260802a" />
  <!-- OpenSeadragon 5.0.1（已本地化） -->
  <script src="/static/openseadragon.min.js"></script>
</head>
<body>
  <!-- 统一标题栏 + 工具栏（macOS unified titlebar-toolbar） -->
  <header id="app-header">
    <!-- 菜单按钮：仅手机端显示，打开侧栏抽屉 -->
    <button id="menu-btn" class="icon-btn menu-btn" aria-label="菜单">☰</button>
    <div class="title-group">
      <span class="header-title">SVS 病理图像查看器</span>
      <span class="title-sep">·</span>
      <span id="current-slide" class="header-current">未打开切片</span>
    </div>
    <!-- 移动端缩放徽章：顶部栏右侧（底部 ⋯ 不再放倍率） -->
    <span id="header-zoom-badge" class="zoom-badge header-zoom-badge">—</span>

    <div id="toolbar">
      <!-- 缩放 -->
      <div class="btn-group">
        <button id="zoom-out" class="icon-btn" title="缩小" aria-label="缩小">−</button>
        <button id="zoom-in" class="icon-btn" title="放大" aria-label="放大">+</button>
      </div>

      <!-- 视图变换：旋转/镜像/复位 —— 常驻主栏（桌面内联、移动端底栏直接可达） -->
      <div class="btn-group view-tools">
        <button id="rotate-btn" class="icon-btn" title="顺时针旋转 90°" aria-label="旋转">↻</button>
        <button id="flip-btn" class="icon-btn" title="水平翻转（镜像）" aria-label="镜像">⇋</button>
        <button id="reset-btn" class="tool-btn" title="复位">Reset</button>
      </div>

      <!-- ROI 分段控件（NSSegmentedControl 风格；仅桌面端显示） -->
      <div class="seg-control roi-group" role="group" aria-label="ROI 分段">
        <button id="roi-6" class="seg roi-btn" data-size="6"><span class="tb-txt">ROI </span>6mm</button>
        <button id="roi-6-5" class="seg roi-btn" data-size="6.5"><span class="tb-txt">ROI </span>6.5mm</button>
      </div>
      <!-- 移动端 ROI 滑块分段（桌面隐藏）：滑动拇指 + 点选切换尺寸，再点退出 -->
      <div id="roi-box-btn" class="roi-slider" role="group" aria-label="矩形标记尺寸">
        <span class="roi-slider-thumb" aria-hidden="true"></span>
        <button type="button" class="roi-slider-seg" data-size="6" aria-label="6 毫米矩形标记">6</button>
        <button type="button" class="roi-slider-seg" data-size="6.5" aria-label="6.5 毫米矩形标记">6.5</button>
      </div>

      <!-- 标注绘制工具：箭头 / 描图（与 ROI 模式互斥） -->
      <div class="btn-group anno-tools">
        <button id="anno-arrow-btn" class="tool-btn" title="绘制箭头标注" disabled>↗<span class="tb-txt"> 箭头</span></button>
        <button id="anno-free-btn" class="tool-btn" title="绘制描图标注" disabled>〰<span class="tb-txt"> 描图</span></button>
      </div>

      <!-- 标记：打开当前切片标注面板 -->
      <button id="anno-btn" class="tool-btn" disabled>标记</button>

      <!-- AI 读片助手（仅管理员，打开后 enable） -->
      <button id="ai-btn" class="tool-btn ai-btn" disabled title="AI 读片助手（管理员）">✨ AI</button>

      <!-- 显示全部标记：移动端已并入标注面板头部；桌面端在此内联保留 -->
      <button id="anno-all-btn" class="tool-btn" disabled>显示全部标记</button>

      <!-- 上下文动作条：桌面 display:contents（内联）；移动端仅在 ROI/绘制激活时显示 -->
      <div class="tbb-context" id="tbb-context">
        <!-- 标注人（管理员标注用，默认"管理员"） -->
        <input id="anno-label-input" type="text" maxlength="40"
               class="anno-label-input" placeholder="默认 管理员"
               title="标注人（留空则用「管理员」）" autocomplete="off" />
        <!-- 保存当前矩形选区为标注（仅 ROI 模式可用，与「保存图片」区分） -->
        <button id="save-anno-btn" class="tool-btn anno-save" disabled title="把当前矩形选区保存为标注">保存标记</button>
        <!-- 主操作 -->
        <button id="save-btn" class="tool-btn primary" disabled>保存图片</button>
        <!-- mpp 手动设置区（仅 mpp 缺失/估算时由 JS 显示）：⋯ 移除后改置于此 -->
        <div id="mpp-setter" class="mpp-setter" style="display:none;">
          <input id="mpp-input" type="number" step="0.01" min="0.01" placeholder="mpp" title="手动输入 µm/px" />
          <button id="mpp-set-btn" class="tool-btn">设置</button>
        </div>
      </div>

      <div class="spacer"></div>

      <span id="zoom-badge" class="zoom-badge">—</span>

      <!-- ⋯ 溢出（仅移动端显示）：装 AI 读片助手 + 缩放徽章，避免挤爆底栏 -->
      <button id="tbb-more-btn" class="icon-btn tbb-more-btn" aria-label="更多">⋯</button>
      <div id="tbb-more" class="tbb-more" role="menu">
        <button id="tbb-more-ai" class="tool-btn" title="AI 读片助手（管理员）">✨ AI 读片</button>
      </div>
    </div>
  </header>

  <!-- 主体：左侧边栏 + 右侧查看器 -->
  <div id="main">
    <!-- 侧栏抽屉遮罩（手机端，打开抽屉时显示，点击关闭） -->
    <div id="sidebar-mask" class="sidebar-mask"></div>
    <!-- 左侧边栏：Finder 源列表风 -->
    <aside id="sidebar">
      <div class="sidebar-top">
        <button id="upload-btn" class="btn primary block">上传切片</button>
        <button id="new-project-btn" class="btn secondary block">＋ 新建项目</button>
        <input id="file-input" type="file"
               accept=".svs,.tif,.tiff,.ndpi,.mrxs,.vms,.vmu,.scn,.bif,.svslide,.zip"
               hidden />
        <div id="progress-wrap" class="progress-wrap" style="display:none;">
          <div id="progress-bar" class="progress-bar"></div>
          <span id="progress-text" class="progress-text">0%</span>
        </div>

        <!-- 内联新建项目表单 -->
        <div id="new-project-form" class="new-project-form" style="display:none;">
          <input id="np-name" type="text" maxlength="60" placeholder="项目名称" autocomplete="off" />
          <input id="np-note" type="text" maxlength="200" placeholder="备注（可选）" autocomplete="off" />
          <div class="np-actions">
            <button id="np-confirm" class="btn primary small">确认</button>
            <button id="np-cancel" class="btn secondary small">取消</button>
          </div>
        </div>
      </div>

      <div class="sidebar-scroll">
        <!-- 分区：项目 -->
        <div class="section-head">项目</div>
        <!-- 项目列表 -->
        <div id="project-list" class="project-list">
          <!-- 由 JS 动态渲染 -->
        </div>

        <!-- 未归类切片（不在任何项目） -->
        <div id="unfiled-section" class="section">
          <div class="section-head row" id="unfiled-toggle">
            <span class="caret">▾</span>
            <span class="section-title">未归类切片</span>
            <span id="unfiled-count" class="count-badge">0</span>
          </div>
          <div id="unfiled-body" class="section-body">
            <div id="unfiled-list" class="unfiled-list"></div>
            <div class="unfiled-ops">
              <button id="unfiled-new-project" class="btn secondary small">新建项目(含选中)</button>
              <button id="unfiled-share" class="btn primary small">分享选中</button>
            </div>
          </div>
        </div>

        <!-- 分享管理（折叠区） -->
        <div class="section">
          <div class="section-head row" id="share-mgr-toggle">
            <span class="caret">▾</span>
            <span class="section-title">分享管理</span>
          </div>
          <!-- 创建分享控件 -->
          <div id="share-mgr-body" class="section-body">
            <div class="share-row">
              <select id="share-expires-select" class="select">
                <option value="6">6 小时</option>
                <option value="24" selected>24 小时</option>
                <option value="72">3 天</option>
                <option value="168">7 天</option>
                <option value="custom">自定义</option>
              </select>
              <input id="share-expires-custom" class="input" type="number"
                     min="0.1" max="720" step="0.1" placeholder="小时" style="display:none;" />
              <select id="share-roi-size-select" class="select" title="矩形标记可选尺寸">
                <option value="both" selected>标记：两者</option>
                <option value="6">仅 6mm</option>
                <option value="6.5">仅 6.5mm</option>
              </select>
            </div>
            <button id="share-create-btn" class="btn primary block">分享选中切片</button>

            <!-- 创建结果 -->
            <div id="share-result" class="share-result" style="display:none;">
              <input id="share-result-url" class="share-result-url" readonly />
              <button id="share-result-copy" class="btn primary small">复制</button>
            </div>

            <!-- 分享列表 -->
            <div id="share-list" class="share-list"></div>
          </div>
        </div>
      </div>

      <div class="sidebar-bottom">
        <a id="logout-btn" class="logout-link" href="/logout" hidden>退出登录</a>
      </div>
    </aside>

    <!-- 右侧查看器 -->
    <main id="viewer-wrap">
      <div id="viewer"></div>
      <!-- 标注画布层：在瓦片之上、ROI 框之下；pointer-events 由绘制模式控制 -->
      <canvas id="anno-canvas" class="anno-canvas"></canvas>
      <!-- 拖拽上传提示遮罩 -->
      <div id="drop-overlay" class="drop-overlay">
        <div class="drop-text">松开以上传切片</div>
      </div>

      <!-- 切片选择浮层（添加切片到项目） -->
      <div id="slide-picker-mask" class="picker-mask" style="display:none;">
        <div class="picker-dialog">
          <div class="picker-title">
            <span id="picker-title-text">添加切片到项目</span>
            <button id="picker-close" class="icon-btn close" aria-label="关闭">×</button>
          </div>
          <div id="picker-list" class="picker-list"></div>
          <div class="picker-footer">
            <span id="picker-selected-count" class="picker-count">已选 0</span>
            <button id="picker-confirm" class="btn primary">确认添加</button>
          </div>
        </div>
      </div>

      <!-- 标注面板（查看器右侧/底部） -->
      <div id="anno-panel" class="anno-panel" style="display:none;">
        <div class="anno-panel-header">
          <span id="anno-panel-title">标注</span>
          <div class="anno-panel-header-actions">
            <!-- 显示/隐藏全部标记：与 state.showAnno 联动（active = 显示全部） -->
            <button id="anno-all-toggle" class="panel-eye-btn" title="显示/隐藏全部标记" aria-label="显示/隐藏全部标记" aria-pressed="false">👁</button>
            <button id="anno-panel-close" class="icon-btn close" aria-label="关闭">×</button>
          </div>
        </div>
        <div id="anno-edit-wrap" class="anno-edit-wrap" style="display:none;"></div>
        <div id="anno-panel-list" class="anno-panel-list">
          <div class="anno-panel-empty">暂无标注</div>
        </div>
      </div>

      <!-- AI 读片助手面板（管理员） -->
      <div id="ai-panel" class="ai-panel" style="display:none;">
        <div class="ai-panel-header">
          <span id="ai-panel-title">✨ AI 读片助手</span>
          <div class="ai-panel-header-actions">
            <button id="ai-panel-close" class="icon-btn close" aria-label="关闭">×</button>
          </div>
        </div>

        <!-- 1. 设置区（未配置时展开） -->
        <div id="ai-config-wrap" class="ai-config-wrap">
          <div class="ai-config-title">AI 服务配置</div>
          <label class="ai-field">
            <span>Base URL</span>
            <input id="ai-base-url" type="text" placeholder="https://api.openai.com/v1"
                   autocomplete="off" />
          </label>
          <label class="ai-field">
            <span>API Key</span>
            <input id="ai-api-key" type="password" placeholder="sk-..."
                   autocomplete="off" />
          </label>
          <label class="ai-field">
            <span>模型</span>
            <input id="ai-model" type="text" placeholder="gpt-4o"
                   autocomplete="off" />
          </label>
          <div class="ai-config-actions">
            <button id="ai-config-save" class="btn primary small">保存配置</button>
            <span id="ai-config-hint" class="ai-config-hint"></span>
          </div>
        </div>
        <!-- 已配置时折叠，留"重新配置"小链 -->
        <div id="ai-config-collapsed" class="ai-config-collapsed" style="display:none;">
          <span id="ai-config-summary" class="ai-config-summary"></span>
          <button id="ai-reconfig-btn" class="link-btn">重新配置</button>
        </div>

        <!-- 2. 任务输入 -->
        <div class="ai-task-wrap">
          <textarea id="ai-task" class="ai-task" rows="3"
                    placeholder="让 AI 做什么，如：扫一遍这张片，标出可疑区域并总结"></textarea>
          <div class="ai-task-actions">
            <button id="ai-task-jump" class="tool-btn small" title="把当前 ROI/选中标注的坐标写进任务">判读当前选区</button>
            <button id="ai-start-btn" class="btn primary small">开始</button>
            <button id="ai-stop-btn" class="btn small" style="display:none;">停止</button>
          </div>
        </div>

        <!-- 3. 轨迹流 -->
        <div id="ai-trace" class="ai-trace">
          <div class="ai-trace-empty">点击「开始」让 AI 读片。轨迹会显示在这里。</div>
        </div>
      </div>
    </main>
  </div>

  <!-- ⋯ 面板遮罩（移动端，点外关闭） -->
  <div id="tbb-more-mask" class="tbb-more-mask"></div>

  <!-- toast 容器 -->
  <div id="toast-container"></div>

  <script src="/static/app.js?v=20260802a"></script>
</body>
</html>
